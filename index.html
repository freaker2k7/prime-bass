<!DOCTYPE html>
<html>

<head>
  <title>Prime Bass</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="A web app that generates bass tabs based on prime numbers and plays them using the Tone.js library.">
  <meta name="keywords" content="JavaScript, Tone.js, bass tabs, prime numbers, music generation">
  <meta name="author" content="Evgeny Kolyakov">
  <meta name="theme-color" content="#000000">

  <link rel="icon" href="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace;
    }

    body {
      padding: 20px;
      background: url('https://i.imgur.com/pdYSl4J.png') no-repeat center center fixed;
      background-size: cover;
    }

    input {
      margin: 10px;
      padding: 10px;
      width: 200px;
      border: 1px solid #b9b7af;
      border-radius: 5px;
      text-align: left;
      background: #ebe9e2;
      outline: none;
    }

    input[type="submit"] {
      background-color: #4CAF50;
      color: white;
      border: none;
      transition: background-color 0.3s ease;
      text-align: center;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #45a049;
      font-weight: bold;
    }

    input:not([type="submit"]):focus {
      border-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      font-size: 14px;
    }

    #root {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-items: center;
    }

    #form {
      margin-top: 50px;
      width: 300px;
      background-color: #edeae3;
      padding: 20px;
      border: 1px solid #cfcdc5;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    #github-corner {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      background-color: #d7d7d7;
      border-radius: 0 0 0 30px;
      transition: all 0.3s ease-in-out;
    }

    #github-corner:hover {
      width: 80px;
      height: 80px;
      background-color: #575757;
    }

    #github-corner img {
      border-radius: 50%;
    }
  </style>

  <script src="https://unpkg.com/tone@latest/build/Tone.js"></script>
</head>

<body>
  <a href="https://github.com/freaker2k7/prime-bass" id="github-corner" target="_blank" rel="noopener noreferrer">
    <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" width="40">
  </a>
  <div id="root">
    <form id="form">
      <label for="primes">Number of Primes:</label>
      <input type="number" id="primes" placeholder="Number of Primes" value="100" min="1" />
      <label for="frets">Number of Frets:</label>
      <input type="number" id="frets" placeholder="Number of frets" value="19" min="10" max="32" />
      <label for="notes">Number of Notes:</label>
      <input type="number" id="notes" placeholder="Number of Notes" value="8" min="1" max="128" />
      <label for="duration">Note Duration (ms):</label>
      <input type="number" id="duration" placeholder="Note Duration (ms)" value="150" min="50" max="1000" />
      <input type="submit" value="Play Bass" id="play-button" />
    </form>
  </div>

  <script>
    let synth;
    let events;
    let isPlaying = false;
    
    const playButton = document.getElementById("play-button");
    
    // Standard bass tuning (Hz)
    const tuning = {
      1: 41.20,  // E1
      3: 55.00,  // A1
      7: 73.42,  // D2
      9: 98.00   // G2
    };

    const isPrime = (n) => {
      if (n % 5 === 0) {
        return false;
      } 
    
    
      const iEnd = Math.sqrt(n);
      for (let i = 2; i < iEnd; ++i) {
        if (n % i === 0) {
          return false;
        }
      }

      return true;
    };

    function fretToFreq(openFreq, fret, frets) {
      return openFreq * Math.pow(2, fret / frets);
    }

    async function playTab() {
      const frets = parseInt(document.getElementById("frets").value);
      const numNotes = parseInt(document.getElementById("notes").value);
      const duration = parseInt(document.getElementById("duration").value);
      const numPrimes = parseInt(document.getElementById("primes").value);

      await Tone.start();

      synth = new Tone.MonoSynth({
        oscillator: { type: "sawtooth" },
        filter: { Q: 2, type: "lowpass", rolloff: -24 },
        envelope: {
          attack: 0.01,
          decay: 0.1,
          sustain: 0.5,
          release: 1
        }
      }).toDestination();

      const events = setPrimes(numPrimes, frets);

      const stepDuration = duration / 1000; // Convert ms to seconds

      const now = Tone.now();
      
      for (let i = 1, j = 0; i < count; i += 2, ++j) {
        if (isPrime(i)) {
          const k = `${i % 10}`;
          for (const t in tabs) {
            if (t === k) {
              synth.triggerAttackRelease(
                fretToFreq(tuning[t], i % frets, frets),
                `${numNotes}n`,
                now + j * stepDuration
              );
            }
          }
        }
      }

      isPlaying = true;
    }

    async function stopTab() {
      if (synth) {
        synth.dispose();
        synth = null;
      }

      isPlaying = false;
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();

      if (isPlaying) {
        stopTab();
        playButton.value = "Play Bass";
      } else {
        playTab();
        playButton.value = "Stop Bass";
      }
    });
  </script>
</body>

</html>
