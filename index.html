  <style>
    * {
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      padding: 0;
      margin: 0;
      background: url('https://i.imgur.com/pdYSl4J.png') no-repeat center center fixed;
      background-size: cover;
    }

    input {
      margin: 10px;
      padding: 10px;
      width: 200px;
      border: 1px solid #b9b7af;
      border-radius: 5px;
      text-align: left;
      background: #ebe9e2;
      outline: none;
    }

    input[type="submit"] {
      background-color: #4CAF50;
      color: white;
      border: none;
      transition: background-color 0.3s ease;
      text-align: center;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #45a049;
      font-weight: bold;
    }

    input:not([type="submit"]):focus {
      border-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      font-size: 14px;
    }

    #root {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-items: center;
    }

    #form {
      margin: 100px auto;
      width: 300px;
      background-color: #edeae3;
      padding: 20px;
      border: 1px solid #cfcdc5;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    #github-corner {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      background-color: #d7d7d7;
      border-radius: 0 0 0 30px;
      transition: all 0.3s ease-in-out;
    }

    #github-corner:hover {
      width: 80px;
      height: 80px;
      background-color: #575757;
    }

    #github-corner img {
      border-radius: 50%;
    }
  </style>

  <script src="https://unpkg.com/tone@latest/build/Tone.js"></script>
</head>

<body>
  <a href="https://github.com/freaker2k7/prime-bass" id="github-corner" target="_blank">
    <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" width="40">
  </a>
  <div id="root">
    <form id="form">
      <label for="primes">Number of Primes:</label>
      <input type="number" id="primes" placeholder="Number of Primes" value="100" min="2" step="1" />
      <label for="frets">Number of Frets:</label>
      <input type="number" id="frets" placeholder="Number of frets" value="19" min="10" max="32" step="1" />
      <label for="notes">Number of Notes:</label>
      <input type="number" id="notes" placeholder="Number of Notes" value="8" min="1" max="128" step="1" />
      <label for="duration">Note Duration (ms):</label>
      <input type="number" id="duration" placeholder="Note Duration (ms)" value="150" min="50" max="1000" step="1" />
      <input type="submit" value="Play Bass" id="play-button" />
    </form>
  </div>

  <script>
    let isPlaying;
    let synth;

    // Standard bass tuning (Hz)
    const tuning = {
      1: 41.20,  // E1
      3: 55.00,  // A1
      7: 73.42,  // D2
      9: 98.00   // G2
    };

    const isPrime = (n) => {
      const iEnd = Math.sqrt(n);
      for (let i = 2; i <= iEnd; ++i) {
        if (n % i === 0) {
          return false;
        }
      }

      return true;
    };

    function fretToFreq(openFreq, fret, frets) {
      return openFreq * Math.pow(2, fret / frets);
    }

    async function play() {
      document.getElementById("play-button").value = "Stop Bass";
      isPlaying = true;

      const duration = parseInt(document.getElementById("duration").value || 150) / 1000; // in seconds
      const frets = parseInt(document.getElementById("frets").value || 19);
      const numNotes = parseInt(document.getElementById("notes").value || 8);
      const numPrimes = parseInt(document.getElementById("primes").value || 100);
      const now = Tone.now();

      await Tone.start();

      synth = new Tone.MonoSynth({
        oscillator: { type: "sawtooth" },
        filter: { Q: 2, type: "lowpass", rolloff: -24 },
        envelope: {
          attack: 0.01,
          decay: 0.1,
          sustain: 0.5,
          release: 1
        }
      }).toDestination();

      /*
        In order not to check for the 5 (prime number) every time,
        we initialize 1 & 3 and start the loop from 7, which is the next prime number.
      */

      synth.triggerAttackRelease(fretToFreq(tuning[1], 1, frets), `${numNotes}n`, now + duration);
      synth.triggerAttackRelease(fretToFreq(tuning[3], 3, frets), `${numNotes}n`, now + duration * 2);

      /*
        No point in checking even numbers, so we start from 7 and increment by 2
        and there're already 2 notes played, so we start the loop with j = 2.
      */
      for (let i = 7, j = 2; j < numPrimes; i += 2) {
        if (isPrime(i)) {
          synth.triggerAttackRelease(
            fretToFreq(tuning[i % 10], i % frets, frets),
            `${numNotes}n`,
            now + duration * ++j
          );
        }
      }
    }

    function stop() {
      document.getElementById("play-button").value = "Play Bass";
      isPlaying = false;

      if (synth) {
        synth.dispose();
        synth = null;
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();

      if (isPlaying) {
        return stop();
      }

      play();
    });
  </script>
</body>

</html>
